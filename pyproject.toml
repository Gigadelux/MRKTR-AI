[project]
name = "mrktr-ai"
version = "0.1.0"
description = "General, modular go-to-market agent: Gmail first touch, Telegram conversation, CRM updates, with guards, evals and security tests."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.34.0",
    "braintrust==0.52.0",
    "elevenlabs>=2.80.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.2.0",
    "milvus-lite>=3.2.2",
    "openai>=3.59.0",
    "pydantic-settings>=2.16.3",
    "pymilvus>=3.0.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
    "supabase>=2.34.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
src = [".", "app/streamlit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings are fine; the formatter handles code

[tool.pytest.ini_options]
testpaths = ["app/tests"]
